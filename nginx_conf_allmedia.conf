##############################################################
# Nginx Config — staging-webmobile-rrfx.techcrm.net
# Flutter Web App + CORS Reverse Proxy + WebSocket Proxy
# Created by: AllMedia
#
# ═══════════════════════════════════════════════════════════
# CARA DEPLOY KE VULTR:
# ═══════════════════════════════════════════════════════════
#
# 1. Build Flutter Web (di local):
#      flutter build web --release
#
# 2. Upload hasil build/web/ ke server Vultr:
#      scp -r build/web/* root@vultr:/var/www/html/staging-webmobile-rrfx.techcrm.net/
#
# 3. Copy nginx config ke server:
#      scp nginx_conf_allmedia.conf root@vultr:/etc/nginx/sites-available/staging-webmobile-rrfx.techcrm.net
#
# 4. Enable site & test:
#      ssh root@vultr
#      ln -s /etc/nginx/sites-available/staging-webmobile-rrfx.techcrm.net /etc/nginx/sites-enabled/
#      nginx -t
#
# 5. Pasang SSL (Let's Encrypt via Certbot):
#      certbot certonly --webroot -w /var/www/html/staging-webmobile-rrfx.techcrm.net -d staging-webmobile-rrfx.techcrm.net
#      systemctl reload nginx
#
# 6. Verify (uncomment HTTPS block in config jika sudah ada cert):
#      curl https://staging-webmobile-rrfx.techcrm.net/
#
# ═══════════════════════════════════════════════════════════
# VULTR SETUP NOTES:
#   - Document root: /var/www/html/staging-webmobile-rrfx.techcrm.net/
#   - Nginx config: /etc/nginx/sites-available/
#   - SSL certs (certbot): /etc/letsencrypt/live/staging-webmobile-rrfx.techcrm.net/
#   - Logs: /var/log/nginx/
#   - Reload after changes: systemctl reload nginx
# ═══════════════════════════════════════════════════════════
##############################################################

# ─────────────────────────────────────────────────────────
# HTTP → HTTPS Redirect
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name staging-webmobile-rrfx.techcrm.net;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────
# HTTPS Server Block
# ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-webmobile-rrfx.techcrm.net;

    # ── SSL Certificate ──────────────────────────────────
    # Path untuk Vultr (certbot standard location)
    ssl_certificate     /etc/letsencrypt/live/staging-webmobile-rrfx.techcrm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-webmobile-rrfx.techcrm.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Document Root ────────────────────────────────────
    root /var/www/html/staging-webmobile-rrfx.techcrm.net;
    index index.html;

    # ── DNS Resolver ─────────────────────────────────────
    resolver 8.8.8.8 1.1.1.1 valid=30s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────
    # GZIP Compression (7.8MB → ~2.2MB)
    # ─────────────────────────────────────────────────────
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2;

    # ─────────────────────────────────────────────────────
    # CORS Reverse Proxy: /api/ → api-rrfx.luxurymatrix.com
    # ─────────────────────────────────────────────────────
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://api-rrfx.luxurymatrix.com/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host api-rrfx.luxurymatrix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Strip upstream CORS headers to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────
    # CORS Reverse Proxy: /gateway/ → gateway.rrfx.co.id
    # ─────────────────────────────────────────────────────
    location /gateway/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://gateway.rrfx.co.id/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host gateway.rrfx.co.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────
    # CORS Reverse Proxy: /mt5/ → api-mt5.techcrm.net
    # ─────────────────────────────────────────────────────
    location /mt5/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://api-mt5.techcrm.net/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host api-mt5.techcrm.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-market/ → ws://207.148.119.106:9003
    # ─────────────────────────────────────────────────────
    location /ws-market/ {
        proxy_pass http://207.148.119.106:9003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-account/ → ws://207.148.119.106:9006
    # ─────────────────────────────────────────────────────
    location /ws-account/ {
        proxy_pass http://207.148.119.106:9006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────
    # Static Assets Caching
    # ─────────────────────────────────────────────────────
    # main.dart.js berubah setiap build — short cache
    location = /main.dart.js {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # flutter_bootstrap.js juga berubah setiap build
    location = /flutter_bootstrap.js {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Assets statis (font, gambar, canvaskit) — long cache
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|avif|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Flutter service worker — JANGAN di-cache
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ─────────────────────────────────────────────────────
    # Deep Links — Apple App Site Association
    # ─────────────────────────────────────────────────────
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files /apple-app-site-association =404;
    }

    # ─────────────────────────────────────────────────────
    # Deep Links — Android Asset Links
    # ─────────────────────────────────────────────────────
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files /assetlinks.json =404;
    }

    # ─────────────────────────────────────────────────────
    # Flutter Web SPA Routing — semua path ke index.html
    # ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────
    # Security Headers
    # ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────
    access_log /var/log/nginx/staging-webmobile-rrfx.techcrm.net.log;
    error_log  /var/log/nginx/staging-webmobile-rrfx.techcrm.net.error.log;

    client_max_body_size 20M;
}
