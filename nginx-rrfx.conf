##############################################################
# Nginx Config - rrfx.mathlab.id
# Flutter Web App + CORS Reverse Proxy + WebSocket Proxy
#
# ═══════════════════════════════════════════════════════════
# CARA PASANG DI AAPANEL:
# ═══════════════════════════════════════════════════════════
# 
# OPSI 1: Via aaPanel UI (RECOMMENDED)
#   1. Login aaPanel → Website → rrfx.mathlab.id → Settings
#   2. Klik "Nginx Config" / "Configuration file"
#   3. COPY semua isi location blocks di bawah (dari /api/ 
#      sampai /ws-account/) lalu PASTE ke dalam server {} 
#      block yang sudah ada, SEBELUM location / { ... }
#   4. Klik Save, lalu Restart Nginx
#
# OPSI 2: Via SSH (edit file langsung)
#   1. Edit file:
#      nano /www/server/panel/vhost/nginx/rrfx.mathlab.id.conf
#   2. Tambahkan location blocks ke dalam server {} block
#   3. Test: nginx -t
#   4. Reload: systemctl reload nginx
#
# JANGAN taruh di /etc/nginx/sites-available/ — aaPanel
# tidak membaca dari situ!
# ═══════════════════════════════════════════════════════════
##############################################################

server {
    listen 80;
    listen [::]:80;
    server_name rrfx.mathlab.id;

    # DNS resolver untuk proxy upstream (Google + Cloudflare)
    resolver 8.8.8.8 1.1.1.1 valid=30s;
    resolver_timeout 5s;

    # Redirect HTTP to HTTPS (aktifkan setelah SSL terpasang)
    # return 301 https://$host$request_uri;

    root /www/wwwroot/rrfx.mathlab.id;
    index index.html;

    # ─────────────────────────────────────────────────────────
    # GZIP Compression (7.8MB → 2.2MB)
    # ─────────────────────────────────────────────────────────
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2;

    # ─────────────────────────────────────────────────────────
    # CORS Reverse Proxy: /api/ → api-rrfx.luxurymatrix.com
    # ─────────────────────────────────────────────────────────
    location /api/ {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://api-mobile-rrfx.techcrm.dev/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host api-rrfx.luxurymatrix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Strip upstream CORS headers to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────────
    # CORS Reverse Proxy: /gateway/ → gateway.rrfx.co.id
    # ─────────────────────────────────────────────────────────
    location /gateway/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://gateway.rrfx.co.id/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host gateway.rrfx.co.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Strip upstream CORS headers to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────────
    # CORS Reverse Proxy: /mt5/ → api-mt5.techcrm.net
    # ─────────────────────────────────────────────────────────
    location /mt5/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://api-mt5.techcrm.net/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host api-mt5.techcrm.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Strip upstream CORS headers to prevent duplicates
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-market/ → ws://207.148.119.106:9003
    # ─────────────────────────────────────────────────────────
    location /ws-market/ {
        proxy_pass http://207.148.119.106:9003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-account/ → ws://207.148.119.106:9006
    # ─────────────────────────────────────────────────────────
    location /ws-account/ {
        proxy_pass http://207.148.119.106:9006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────
    # Static assets caching (Flutter build output)
    # ─────────────────────────────────────────────────────────
    # main.dart.js changes every build - short cache with revalidation
    location = /main.dart.js {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # flutter_bootstrap.js also changes every build
    location = /flutter_bootstrap.js {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Other static assets (fonts, images, canvaskit) - long cache
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|avif|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Flutter service worker - jangan di-cache
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ─────────────────────────────────────────────────────────
    # Flutter Web SPA routing - semua path ke index.html
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────
    # Security Headers
    # ─────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging (aaPanel default log path)
    access_log /www/wwwlogs/rrfx.mathlab.id.log;
    error_log  /www/wwwlogs/rrfx.mathlab.id.error.log;

    client_max_body_size 20M;
}

