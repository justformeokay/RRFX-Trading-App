  in_app_update: ^4.2.3
  upgrader: ^12.5.0
  flutter_pdfview: ^1.3.4
  path_provider: ^2.1.5
  device_info_plus: ^11.5.0
  cached_network_image: ^3.4.1
  flutter_localization: ^0.3.3
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
