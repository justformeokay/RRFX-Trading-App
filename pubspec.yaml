  sqflite: ^2.4.2
  get_storage: ^2.1.1
  supabase: ^2.10.0
  shimmer: ^3.0.0
  flutter_svg: ^2.2.2
  flutter_widget_from_html: ^0.16.1
  home_widget: ^0.7.0
  workmanager: ^0.7.0
  local_auth: ^2.3.0
  local_auth_android: ^1.0.43
  pointer_interceptor: ^0.10.1+2
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mockito: ^5.4.6

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-rrfx.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/fonts/
    - assets/sounds/
    - assets/svgs/

  fonts:
    - family: OCRA
      fonts:
        - asset: assets/fonts/OCRA-Alternate.otf
