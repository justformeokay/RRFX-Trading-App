##############################################################
# LOCATION BLOCKS untuk ditambahkan ke Nginx Config aaPanel
# 
# CARA:
# 1. Login aaPanel → Website → rrfx.mathlab.id → Settings
# 2. Klik "Configuration file" / "Nginx Config"
# 3. Cari blok: location / { try_files ... }
# 4. PASTE semua isi file ini SEBELUM blok location / { }
# 5. Save → Restart Nginx
#
# Atau via SSH:
#   nano /www/server/panel/vhost/nginx/rrfx.mathlab.id.conf
#   nginx -t && systemctl reload nginx
##############################################################

    # DNS resolver untuk proxy upstream
    resolver 8.8.8.8 1.1.1.1 valid=30s;
    resolver_timeout 5s;

    # ─────────────────────────────────────────────────────────
    # GZIP Compression (7.8MB JS → 2.2MB compressed)
    # ─────────────────────────────────────────────────────────
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2;

    # ─────────────────────────────────────────────────────────
    # CORS Reverse Proxy: /api/ → api-rrfx.luxurymatrix.com
    # ─────────────────────────────────────────────────────────
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        proxy_pass https://api-rrfx.luxurymatrix.com/;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host api-rrfx.luxurymatrix.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Authorization;
        proxy_pass_header Content-Type;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────────
    # CORS Reverse Proxy: /gateway/ → gateway.rrfx.co.id
    # ─────────────────────────────────────────────────────────
    location /gateway/ {
        if ($request_method = 'OPTIONS') {
