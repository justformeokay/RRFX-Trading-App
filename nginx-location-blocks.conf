        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With, x-api-key' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization' always;
    }

    # ─────────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-market/ → ws://207.148.119.106:9003
    # ─────────────────────────────────────────────────────────
    location /ws-market/ {
        proxy_pass http://207.148.119.106:9003/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────
    # WebSocket Proxy: /ws-account/ → ws://207.148.119.106:9006
    # ─────────────────────────────────────────────────────────
    location /ws-account/ {
        proxy_pass http://207.148.119.106:9006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─────────────────────────────────────────────────────────
    # Flutter service worker - jangan di-cache
    # ─────────────────────────────────────────────────────────
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

